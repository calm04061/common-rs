[package]
name = "common"
version = "0.1.5"
authors = ["Calm0406"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "macros"] }
serde_json = "1.0"
dotenv = "0.15"

[dependencies]
actix-web = { version = "4.13.0", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.32"
r2d2 = "0.8"
dotenv = "0.15"
tokio-postgres = { version = "0.7.17", optional = true }
r2d2_postgres = { version = "0.18.2", optional = true }

r2d2_sqlite = { version = "0.34.0", optional = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio"], optional = true }
async-trait = { version = "0.1.89", optional = true }
lazy_static = "1.5.0"
quartz_sched = { version = "0.1.11", optional = true }
sqlx-oracle = { git = "https://github.com/calm04061/sqlx-oracle.git", branch = "feature/sqlx9", optional = true }

[features]
default = ["r2d2_pg", "web"]
r2d2_pg = ["r2d2_postgres", "tokio-postgres"]
sqlx_pg = ["sqlx", "sqlx/postgres", "async-trait"]
sqlx_oracle = ["sqlx", "sqlx-oracle", "async-trait"]
quartz = ["quartz_sched"]
sqlite = ["r2d2_sqlite"]
web = ["dep:actix-web"]
